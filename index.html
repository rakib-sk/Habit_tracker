<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    
    <nav class="nav">
        <h1 class="nav-heading">Habit Tracker</h1>
      <div class="icons">
        <i class="fa-solid fa-moon"></i>
        <i class="fa-solid fa-sun"></i>
      </div>
      </nav>
    
    <div class="input-habits">
      <div class="habites">
        <input type="text" name="habit" placeholder="Enter new Habite..">
        <button>Add Habite</button>
      </div>
    </div>
    
    <div class="habit-list">
      <h1 class="list-heading">Habit List</h1>
      <div class="habit-crad">
        <h2 class="habit-heading">Coding pratice</h2>
        
        <div class="progress-container">
          <div class="progress-bar" style="width: 70%;"></div>
          
        </div>
        <p class="progress-num">70%</p>
        <div class="buttons">
          <button class="done-btn">Done Today</button>
          <button class="delete-btn">Delete</button>
        </div>
      </div>
    </div>
    
    <div class="status">
      <h1>Status</h1>
      <div class="status-card">
        <div class="status-card-item">
          <div class="text">
          <p>Total Habites  </p>
          <p>Completed Today </p>
          <p>Best Strek</p>
          </div>
          <div class="counter">
            <p>0</p>
            <p>1</p>
            <p>3</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
